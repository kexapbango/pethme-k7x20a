<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FFDDA8">
<title>Pet Home · Round 9</title>
<style>
:root{--bg:#FFF3E0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1F18}}
:root[data-theme="dark"]{--bg:#2A1F18}
html,body{margin:0;height:100%;background:var(--bg);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
.phone{position:relative;height:100%;width:min(100vw,50dvh)}
.fs{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:54px;z-index:30;border:3px solid #E8A458;background:#FFE9B5;color:#6B3F1D;border-radius:12px;width:38px;height:38px;font-size:20px;line-height:1;cursor:pointer;padding:0}
svg{width:100%;height:100%;-webkit-touch-callout:none;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.phone image{pointer-events:none}
.glow{animation:glow 2.2s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
.bar{position:absolute;left:5%;right:5%;bottom:calc(2.5% + env(safe-area-inset-bottom,0px));background:#FFE9B5;border:3px solid #E8A458;border-radius:99px;display:flex;justify-content:space-around;padding:5px}
.bar button{border:0;background:none;font-size:clamp(22px,7vw,30px);border-radius:99px;padding:6px 14px;cursor:pointer}
.bar .on{background:#FFC98A}
.toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);background:#FFE9B5;color:#6B3F1D;border:3px solid #E8A458;padding:6px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.fx{transform-box:fill-box;transform-origin:50% 100%}
.fx.hop{animation:hop .6s ease-out}
.fx.big{animation:big .95s ease-out}
@keyframes hop{0%{transform:scale(1.12,.86)}25%{transform:translateY(-34px) scale(.94,1.08)}55%{transform:scale(1.1,.9)}75%{transform:translateY(-8px)}100%{transform:none}}
@keyframes big{0%{transform:scale(1.15,.84)}30%{transform:translateY(-90px) scale(.92,1.1) rotate(-8deg)}60%{transform:translateY(-70px) scale(.95,1.06) rotate(8deg)}85%{transform:scale(1.12,.88)}100%{transform:none}}
.wig{transform-box:fill-box;transform-origin:50% 100%}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.975)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.sp:nth-of-type(2){animation-delay:.8s}.sp:nth-of-type(3){animation-delay:1.5s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bob,.eye,.sp{animation:none!important}}
.menu{right:8px}
.prof{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;background:linear-gradient(#FFE9B5,#FFD39A);padding-top:calc(54px + env(safe-area-inset-top,0px));overflow:hidden;color:#6B3F1D}
.prof.on{display:flex}
.pbox{position:relative;width:100%;flex:1 1 38%;min-height:0;cursor:pointer}
.arr{position:absolute;top:50%;transform:translateY(-50%);font-size:44px;font-weight:800;color:#E8A458;pointer-events:none;opacity:.8}
.arr.l{left:8px}.arr.r{right:8px}
.sl{animation:sl .28s ease-out}.sr{animation:sr .28s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
.pdots{display:flex;gap:8px;margin:4px 0}
.pdots i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #E8A458;opacity:.6}
.pdots i.on{background:#E8A458;opacity:1}
.pname{width:80%;font:800 30px/1.2 "Nunito","Trebuchet MS",system-ui,sans-serif;text-align:center;color:#6B3F1D;background:transparent;border:0;border-bottom:3px dashed #E8A458;outline:0;padding:2px 0}
.card{width:90%;box-sizing:border-box;margin:10px 0 calc(14px + env(safe-area-inset-bottom,0px));background:#FFF3D9;border:3px solid #E8A458;border-radius:18px;padding:4px 14px;overflow:auto;flex:0 1 auto;max-height:44%}
.row{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dashed #F0CF9A}
.row:last-child{border:0}
.row label{font-size:13px;font-weight:800;color:#B5702F}
.row input,.row span{font:700 15px "Nunito","Trebuchet MS",system-ui,sans-serif;color:#6B3F1D;background:transparent;border:0;outline:0;min-width:0;width:100%}
.modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(90,45,10,.45)}
.modal.on{display:flex}
.mbox{width:76%;background:#FFF3D9;border:4px solid #E8A458;border-radius:20px;padding:16px;text-align:center;color:#6B3F1D;font:800 16px "Nunito","Trebuchet MS",system-ui,sans-serif}
.mbox input{width:100%;box-sizing:border-box;margin:10px 0 12px;padding:10px;font:700 18px "Nunito","Trebuchet MS",system-ui,sans-serif;text-align:center;border:3px solid #E8A458;border-radius:12px;background:#fff;color:#6B3F1D;outline:0}
.mb{display:flex;gap:10px}.mb button{flex:1;padding:10px;border:3px solid #E8A458;border-radius:12px;background:#FFE9B5;color:#6B3F1D;font:800 16px "Nunito","Trebuchet MS",system-ui,sans-serif}
#mo{background:#E8A458;color:#fff}

.dd{position:absolute;top:calc(50px + env(safe-area-inset-top,0px));right:8px;z-index:31;min-width:188px;background:#FFF3D9;border:3px solid #E8A458;border-radius:14px;padding:6px;display:none;flex-direction:column;gap:2px;font:800 15px "Nunito","Trebuchet MS",system-ui,sans-serif;color:#6B3F1D;box-shadow:0 6px 18px rgba(90,45,10,.25)}
.dd.on{display:flex}
.dd button,.pxb button{font:inherit;color:inherit;background:transparent;border:0;border-radius:9px;padding:9px 10px;text-align:left;cursor:pointer}
.dd button:hover,.dd button:active{background:#FFE0A3}
.dd button[disabled]{opacity:.45;cursor:default}
.dd .sub{padding-left:14px;display:flex;flex-direction:column}
.dd small{opacity:.7;font-weight:700}
.pxo{position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(90,45,10,.5)}
.pxb{width:88%;max-width:360px;max-height:92%;overflow:auto;box-sizing:border-box;background:#FFF3D9;border:4px solid #E8A458;border-radius:20px;padding:14px;text-align:center;color:#6B3F1D;font:800 16px "Nunito","Trebuchet MS",system-ui,sans-serif}
.pxb .row2{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.pxb .btn{background:#FFE9B5;border:3px solid #E8A458;text-align:center;padding:8px 14px}
.pxb .btn.pri{background:#F6A85A;color:#fff}
.pxb .btn[disabled]{opacity:.5}
.pxb input.nm{width:100%;box-sizing:border-box;margin-top:10px;padding:8px;font:700 17px inherit;text-align:center;border:3px solid #E8A458;border-radius:12px;background:#fff;color:#6B3F1D;outline:0}
.pxb canvas{width:100%;aspect-ratio:1;touch-action:none;border:3px solid #E8A458;border-radius:14px;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,10px 10px;display:block}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #C99A8A;padding:0!important;cursor:pointer}
.sw.on{box-shadow:0 0 0 4px #6B3F1D}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFE9B5!important;border:3px solid #E8A458!important;padding:10px!important;width:130px}
.pick img{width:100px;height:80px;object-fit:contain}

    .then(function(out){return new Promise(function(res,rej){var u=URL.createObjectURL(out),im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(u);var t=trim(c);t?res(toPet(t)):rej(new Error('empty'))};im.onerror=rej;im.src=u})});
  return Promise.race([job,to])}

/* ---------- main loop ---------- */
function upd(p,dt){
  p.t+=dt;var lift=0;if(p.scene==='out')p.outT-=dt;
  if(p.mode==='idle'){p.idle-=dt;if(p.idle<=0)pick(p)}
  else if(p.mode==='sit'){p.sitT-=dt;if(p.sitT<=0)leave(p)}
  else if(p.mode==='walk'){
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<3){
      if(p.goDoor){p.goDoor=false;passDoor(p)}
      else if(p.goSofa){p.goSofa=false;p.face=1;jump(p,SEATX[p.seat],SEAT_Y,.55,50,land)}
      else{p.mode='idle';p.idle=2+Math.random()*3}
    }else{var v=Math.min(p.spd*dt,d);p.x+=dx/d*v;p.y+=dy/d*v;if(Math.abs(dx)>8)p.face=dx>0?1:-1}
  }
  else if(p.mode==='tween'&&p.tw){
    var T=p.tw;T.t+=dt;var k=Math.min(1,T.t/T.d);
    p.x=T.fx+(T.tx-T.fx)*k;p.y=T.fy+(T.ty-T.fy)*k;lift=-T.arc*Math.sin(Math.PI*k);
    if(k>=1){var dn=T.done;p.tw=null;if(dn)dn(p)}
  }
  var wa=0,wb=0;
  if(p.mode==='walk'){wa=Math.sin(p.t*9)*4;wb=Math.abs(Math.sin(p.t*9))*3}
  if(p.mode==='held'){wa=Math.sin(p.t*18)*7;lift=-34}
  var s=sc(p.y);
  p.root.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') scale('+s.toFixed(3)+')');
  p.flip.setAttribute('transform','scale('+p.face+' 1)');
  p.walk.setAttribute('transform','translate(0 '+(lift-wb).toFixed(1)+') rotate('+wa.toFixed(1)+')');
  p.hapT-=dt;p.bigT-=dt;p.sitAge=(p.mode==='sit')?p.sitAge+dt:0;
  var fc='neutral';if(p.mode==='held')fc='surprised';else if(p.bigT>0)fc='laugh';else if(p.hapT>0)fc='happy';else if(p.sitAge>3)fc='sleepy';
  p.pu.setFace(fc);p.pu.pose(p.t,(p.sit&&p.mode!=='held')?'sit':p.mode,(p.hapT>0||p.bigT>0)&&p.mode!=='held');
  if(p.bubT>=0){p.bubT+=dt;var on=p.scene===scene&&p.bubT>0&&p.bubT<4.5&&p.mode!=='held'&&p.x>cam-20&&p.x<cam+420;
    p.bub.style.opacity=on?1:0;if(p.bubT>=4.5)p.bubT=-1}
  else p.bub.style.opacity=0;
  p.bub.setAttribute('transform','translate('+Math.max(cam+48,Math.min(cam+352,p.x)).toFixed(1)+' '+(p.y-247*s-8).toFixed(1)+')');
}
var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(!sw){if(Math.abs(camV)>2){cam+=camV*dt;camV*=Math.exp(-5*dt);var c2=Math.max(-CL,Math.min(CL,cam));if(c2!==cam){cam=c2;camV=0}}else camV=0}
  if(gest&&gest.held&&gest.vx!==undefined){if(gest.vx<50)cam=Math.max(-CL,cam-260*dt);else if(gest.vx>350)cam=Math.min(CL,cam+260*dt);gest.p.x=gest.vx+cam;clampXY(gest.p,300)}
  if(Math.abs(cam-lastCam)>.05){lastCam=cam;world.setAttribute('transform','translate('+(-cam).toFixed(1)+' 0)')}
  pets.forEach(function(p){upd(p,dt)});
  if(pp){ppT+=dt;pp.pose(ppT,'idle',ppHap)}
  depth();
  for(var i=ps.length-1;i>=0;i--){var q=ps[i];q.life-=dt;
    if(q.life<=0){q.el.remove();ps.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.el.setAttribute('opacity',Math.min(1,q.life/q.max*1.6).toFixed(2));
    q.el.setAttribute('transform','translate('+q.x.toFixed(1)+' '+q.y.toFixed(1)+') scale('+(q.s*(.6+.4*(1-q.life/q.max))).toFixed(2)+')')}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
var tb=$('toast'),tt;
document.querySelectorAll('.bar button').forEach(function(b,i){b.addEventListener('click',function(){
  if(i===0){goScene('home');return}tb.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){tb.style.opacity=0},1400)})});
})();
