    offs.push(onChildRemoved(pr,x=>removeLocal(x.key),()=>{}));
  }catch(e){petsOn=false}
}
function uploadFish(id,l){
  FLAST.set(id,fmeta(l.meta));FSYN.add(id);
  set(ref(db,'rooms/'+room+'/fish/'+id),{meta:clean(l.meta),img:l.img||'',by:uid,ts:Date.now()}).catch(()=>{});
}
function fishIn(id,v,live){      /* a fish record from the friend -> apply here */
  if(!v||!v.meta||typeof v.meta.name!=='string'||(live&&v.by===uid))return;
  if(v.meta.custom&&!v.img)return;
  const ms=fmeta(v.meta);if(FLAST.get(id)===ms)return;
  FLAST.set(id,ms);FSYN.add(id);savF();incF.add(id);
  Promise.resolve(window.PH_FISHIN(id,{meta:clean(v.meta),img:v.img||''})).catch(()=>{}).then(()=>incF.delete(id));
}
function fishOut(id){            /* the friend sent a fish away */
  if(!FSYN.has(id))return;FSYN.delete(id);FLAST.delete(id);savF();
  try{window.PH_FISHDEL(id)}catch(e){}
}
async function fishDiff(){       /* after every save: upload what changed here, remove what I sent away */
  if(!linked||!fishReady||!window.PH_FISHREC)return;
  if(fdBusy){fdAgain=true;return}fdBusy=true;
  try{do{
    fdAgain=false;const L=await window.PH_FISHREC();
    for(const id in L){const l=L[id];if(!l.pending&&FLAST.get(id)!==fmeta(l.meta))uploadFish(id,l)}
    [...FSYN].forEach(id=>{if(!L[id]&&!incF.has(id)){FSYN.delete(id);FLAST.delete(id);remove(ref(db,'rooms/'+room+'/fish/'+id)).catch(()=>{})}});
    savF();
  }while(fdAgain)}catch(e){}finally{fdBusy=false}
}
async function startFish(){
  if(fishOn||!window.PH_FISHREC)return;fishOn=true;
  try{
    const fr=ref(db,'rooms/'+room+'/fish'),R=(await get(fr)).val()||{},L=await window.PH_FISHREC();
    for(const id of new Set([...Object.keys(R),...Object.keys(L)])){
      const r=R[id],l=L[id],ok=r&&r.meta&&typeof r.meta.name==='string';
      if(ok&&l){
        if(l.pending){FSYN.add(id);continue}
        if(fmeta(l.meta)===fmeta(r.meta)){FLAST.set(id,fmeta(r.meta));FSYN.add(id)}
        else if(r.by!==uid)fishIn(id,r);else uploadFish(id,l);
      }else if(ok){
        if(FSYN.has(id)&&!r.meta.builtin){FSYN.delete(id);remove(ref(db,'rooms/'+room+'/fish/'+id)).catch(()=>{})}   /* I sent it away while offline */
        else fishIn(id,r);
      }else if(l&&!l.pending){
        if(FSYN.has(id)&&!l.meta.builtin){FSYN.delete(id);FLAST.delete(id);try{window.PH_FISHDEL(id)}catch(e){}}   /* the friend sent it away */
        else uploadFish(id,l);
      }
    }
    savF();fishReady=true;
    offs.push(onChildAdded(fr,x=>fishIn(x.key,x.val(),true),()=>{}));
    offs.push(onChildChanged(fr,x=>fishIn(x.key,x.val(),true),()=>{}));
    offs.push(onChildRemoved(fr,x=>fishOut(x.key),()=>{}));
  }catch(e){fishOn=false}
}
function openLink(){
  if(cur)return;
  if(!uid){note(authErr?'Sign-in problem: '+authErr:'Connecting… try again in a moment');return}
  cur=ov('');const c0=cur.close;cur.close=()=>{c0();cur=null};render();
}

window.PH_LINK=openLink;
window.PH_SAVED=()=>{pushState();petDiff();photoDiff();fishDiff()};
window.PH_PETSAVED=r=>{if(incoming.delete(r.id)||!linked||!petsReady)return;if(SYN.has(r.id))uploadPet(r)};
onAuthStateChanged(auth,async u=>{
  if(!u||uid===u.uid)return;
  uid=u.uid;await ensureCode();watchInbox();if(room)watchRoom();render();
});
signInAnonymously(auth).catch(e=>{authErr=e.code||'unknown'});
</script>
