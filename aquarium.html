function buildDecor(list,one){
  var placed=decor.map(function(q){return {g:q.D.group,x:q.x,hw:q.w/2+6}});
  (list||DECOR).forEach(function(D){
    for(var n=0;n<(one?1:D.count);n++){
      var tries=0,ok,s,w,h,x;
      do{
        s=D.sprites[Math.floor(rn()*D.sprites.length)];
        if(D.h){h=D.h[0]+rn()*(D.h[1]-D.h[0]);w=h*sprW(s)/MAN[s][3]}else{w=D.w[0]+rn()*(D.w[1]-D.w[0]);h=sprH(s,w)}
        var hw=w/2+(D.layer==='bg'?10:6),lo=MARG+hw,hi=TW-MARG-hw;
        x=lo+rn()*(hi-lo);ok=true;
        for(var p=0;p<placed.length;p++)if(placed[p].g===D.group&&Math.abs(placed[p].x-x)<(placed[p].hw+hw)*D.gap)ok=false;
      }while(!ok&&++tries<250);
      placed.push({g:D.group,x:x,hw:hw});
      decor.push({D:D,s:s,x:x,w:w,h:h,y:D.anchor==='hang'?WL-20:SURF+(D.sink!=null?D.sink:12),rot:0,vel:0,ph:rn()*6,flip:rn()<.5?-1:1});
    }
  });
}
function decorUpdate(d,dt){
  var D=d.D;if(D.chest){chestUpdate(d,dt);return}if(!D.sway&&!D.brush)return;
  var target=Math.sin(T*.8+d.ph)*D.sway,k,f,dx,reach=d.w*.5+30;
  if(D.brush){
    for(k=0;k<fish.length;k++){f=fish[k];if(f.mode!=='live'||f.kind==='crawl'||f.kind==='still')continue;
      dx=d.x-f.x;if(Math.abs(dx)<reach+f.w*.3){
        var inY=D.anchor==='hang'?(f.y<WL+d.h+20):(f.y>SURF-d.h*1.0);
        if(inY)target+=(dx>0?1:-1)*.06*D.brush*(1-Math.abs(dx)/(reach+f.w*.3))*cl(Math.abs(f.vx)/60,.3,1.5)}}
  }

}

/* ============================ 7. CREATURES =============================== */
function bnds(f){var m=MARG,hw=f.w*.5+8,hh=f.h*.5+6;return [m+hw,TW-m-hw,WL+36+hh,SURF+14-hh]}

  var by=bandY(f);f.tx=cl(f.x+(Math.random()<.5?-1:1)*R(sp.hop*.3,sp.hop),b[0],b[1]);f.ty=R(by[0],by[1]);
  if(f.kind==='bob')f.ty=cl(f.y+R(-90,90),by[0],by[1]);
}
/* every fish has an id (fid) and a name; names are not drawn in the tank, the main game's fish book shows them */
var NAMES=['Bubbles','Finn','Coral','Splash','Nemo','Pearl','Ripple','Marlin','Dory','Squirt','Goldie','Bubba','Wave','Sandy','Neptune','Misty','Tide','Pebble','Flipper','Sunny','Shelly','Kelp','Jelly','Skipper','Dash','Gill','Minnow','Reef','Waffle','Mochi'];
function autoName(fid){var h=0,i,k,used={};for(i=0;i<fish.length;i++)used[fish[i].name]=1;for(i=0;i<fid.length;i++)h=(h*31+fid.charCodeAt(i))>>>0;
  for(k=0;k<NAMES.length;k++){var n=NAMES[(h+k)%NAMES.length];if(!used[n])return n}return NAMES[h%NAMES.length]+' '+(fish.length+1)}
function spawn(sp,leader,o){
  o=o||{};var look=o.look||sp.looks[Math.floor(Math.random()*sp.looks.length)],L=o.L||LOOKS[look],w=o.w||sp.w*R(.92,1.08),
    fid=o.fid||('x'+Date.now().toString(36)+Math.floor(R(0,999)));
  var f={sp:sp,L:L,look:look,fid:fid,name:o.name||autoName(fid),kind:sp.kind,w:w,h:lh(L,w),t:R(0,9),ph:R(0,6),mode:'live',skel:false,
    sp0:R(sp.speed[0],sp.speed[1]),mood:1,moodT:R(3,9),react:R(sp.react[0],sp.react[1]),rt:R(0,1),
    cap:R(sp.stomach[0],sp.stomach[1]),extra:sp.extra,stom:R(0,1.2),gt:R(0,2),greedUntil:0,pt:null,
    vx:0,vy:0,face:Math.random()<.5?1:-1,fa:1,rot:0,flipY:false,sqx:1,sqy:1,yoff:0,pop:0,chew:0,
    hold:R(0,2),sc:0,hide:0,hideT:0,gait:0,fleeX:0,ld:null,ox:0,oy:0,ot:0};

function populate(){

}
function thumbOf(L,px){if(!ready||!L)return '';px=px||160;

function restY(f){var d=dims(f),r=f.rotT||0,ext=(d[1]*Math.abs(Math.cos(r))+d[0]*Math.abs(Math.sin(r)))/2;return SURF+14-ext}

/* ---- star / puff effects ---- */
function burst(x,y,n){for(var k=0;k<n;k++)fx.push({x:x,y:y,vx:R(-130,130),vy:R(-230,-70),life:R(.7,1.2),r:R(9,16),rot:R(0,6),vr:R(-7,7)})}
function star(x,y,r,rot){ctx.beginPath();for(var k=0;k<10;k++){var a=rot+k*Math.PI/5-Math.PI/2,q=k%2?r*.45:r;k?ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):ctx.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fillStyle='#FFD54A';ctx.strokeStyle='#C98A12';ctx.lineWidth=Math.max(2,r*.16);ctx.fill();ctx.stroke()}

/* ---- skeleton / faint cycle ---- */
function startDown(f){
  f.cause=null;var L=f.L,sp=f.sp;f.skel=!!f.perm||(sp.recover==='skeleton'&&!!L.skel);
  f.mode=(f.kind==='crawl'||f.kind==='still')?'rest':'sink';
  f.pt=null;f.sc=0;f.hold=0;f.greedUntil=0;f.hideT=0;f.vx*=.2;f.vy=0;f.pop=1;f.landed=f.mode==='rest'?1:0;
  f.rest=R(CFG.recover.rest[0],CFG.recover.rest[1]);
  if(f.skel){f.rotT=R(-.28,.28);f.flipY=Math.random()<.5}
  else{var fr=sp.faintRot!=null?sp.faintRot:1.3;f.rotT=(Math.random()<.5?-1:1)*fr;f.flipY=false}
  burst(f.x,f.y,8);rip.push({x:f.x,y:f.y,r:10,a:.8,tap:1});
}
function wake(f){
  if(f.mode!=='rest'&&f.mode!=='sink')return false;
  f.mode='wake';f.cause=null;f.wk=0;f.wasSkel=f.skel;f.skel=!!f.perm;f.pop=.8;f.rot0=f.rot;f.flipY0=f.flipY;
  var b=bnds(f);f.wy=Math.min(f.y,(f.kind==='crawl'||f.kind==='still')?groundY(f):b[3]);
  burst(f.x,f.y,8);rip.push({x:f.x,y:f.y,r:10,a:.8,tap:1});return true;
}
function wakeNear(x,y){var hit=false;fish.forEach(function(f){
  if((f.mode==='rest'||f.mode==='sink')&&f.cause!=='water'&&Math.hypot(f.x-x,f.y-y)<Math.max(f.w*.75,CFG.recover.tapRadius))hit=wake(f)||hit});return hit}
function updDown(f,dt){
  f.t+=dt;f.pop=Math.max(0,f.pop-dt*2.2);
  if(f.mode==='sink'){
    f.vy=Math.min(f.vy+260*dt,CFG.recover.sink);f.y+=f.vy*dt;f.x+=Math.sin(f.t*3+f.ph)*22*dt;
    f.rot+=(f.rotT-f.rot)*Math.min(1,dt*2.4);
    var ry=restY(f);if(f.y>=ry){f.y=ry;f.mode='rest';f.vy=0;f.landed=1;rip.push({x:f.x,y:SURF,r:8,a:.6})}
  }else{
    f.rot+=(f.rotT-f.rot)*Math.min(1,dt*6);f.y+=(restY(f)-f.y)*Math.min(1,dt*7);
    if(f.landed){if(f.cause!=='water'||water.ok)f.rest-=dt;f.rot=f.rotT+Math.sin(f.t*1.6)*.025;if(f.rest<=0)wake(f)}
  }
  f.x=cl(f.x,MARG+f.w*.5,TW-MARG-f.w*.5);
}
function updWake(f,dt){
  f.wk+=dt;var u=Math.min(1,f.wk/CFG.recover.wake),e=u*u*(3-2*u);f.pop=Math.max(0,f.pop-dt*2.2);
  f.y=f.wy-Math.sin(Math.PI*u)*((f.kind==='crawl'||f.kind==='still')?28:55);
  f.rot=f.rot0*(1-e);if(u>.35)f.flipY=false;
  if(u>=1){f.mode='live';f.stom=0;f.greedUntil=0;f.hold=R(.6,1.4);f.rot=0;f.flipY=false;f.vy=-30;f.vx=0;f.fa=f.face;pick(f)}
}

/* ============================ 8. FEEDING ================================= */
/* Nothing is reserved or claimed. Every hungry creature independently re-targets the nearest pellet
   every `react` seconds; whoever physically reaches a pellet first eats it, the rest re-target. */
function canEat(f,p){
  if(p.out)return false;
  if(f.kind==='crawl'||f.kind==='still')return p.rest>0&&Math.abs(p.x-f.x)<(f.kind==='still'?220:CFG.food.crawlSense);
  return p.in;
}
function hungry(f,dt){
  if(f.stom<f.cap)return true;
  if(f.sp.scav){for(var q=0;q<pel.length;q++)if(pel[q].rest>0&&Math.abs(pel[q].x-f.x)<CFG.food.crawlSense)return true}   /* cleanup crew eats leftovers even when full */
  if(f.greedUntil>T)return true;
  f.gt-=dt;
  if(f.gt<=0){f.gt=R(CFG.food.greedEvery[0],CFG.food.greedEvery[1]);
    if(Math.random()<f.sp.greed){for(var j=0;j<pel.length;j++)if(canEat(f,pel[j])&&Math.hypot(pel[j].x-f.x,pel[j].y-f.y)<CFG.food.greedRange){f.greedUntil=T+R(CFG.food.greedFor[0],CFG.food.greedFor[1]);return true}}}
  return false;
}
function nearestPel(f){var bd=CFG.food.sense,b=null,j,d;for(j=0;j<pel.length;j++){if(!canEat(f,pel[j]))continue;d=Math.hypot(pel[j].x-f.x,pel[j].y-f.y);if(d<bd){bd=d;b=pel[j]}}return b}
function tryEat(f){
  if(!f.pt||f.eatCd>0)return;var p=f.pt,j=pel.indexOf(p);if(j<0)return;var hit;
  if(f.kind==='crawl'||f.kind==='still')hit=Math.abs(p.x-f.x)<f.w*.38&&p.rest>0;
  else{var mx=f.x+(f.L.face===0?0:f.face)*f.sp.mouth[0]*f.w,my=f.y+f.sp.mouth[1]*f.h,reach=Math.max(36,f.w*.3),onFloor=p.rest>0;
    hit=Math.abs(p.x-mx)<reach&&Math.abs(p.y-my)<reach+(onFloor?f.h*.3:0)}
  if(!hit)return;
  var left=p.rest>0;if(left)DBG.eaten++;pel.splice(j,1);f.stom+=(f.sp.scav&&left&&f.stom>=f.cap)?.35:1;if(left)water.p=Math.max(0,water.p-(f.sp.clean||CFG.water.eatClean));f.eatCd=.5;f.pt=null;f.rt=f.react;f.chew=.4;
  if(f.stom>=f.cap+f.extra)startDown(f);
}

function updF(f,dt){
  var sp=f.sp,kind=f.kind,crawl=(kind==='crawl'||kind==='still');
  f.t+=dt;f.stom=Math.max(0,f.stom-dt*sp.digest);f.chew=Math.max(0,f.chew-dt);f.eatCd=Math.max(0,(f.eatCd||0)-dt);
  if(f.mode==='sink'||f.mode==='rest'){updDown(f,dt);return}
  if(f.mode==='wake'){updWake(f,dt);return}
  f.moodT-=dt;if(f.moodT<=0){f.moodT=R(4,11);f.mood=R(.78,1.22)}
  f.rt-=dt;
  if(f.pt&&pel.indexOf(f.pt)<0){f.pt=null;f.rt=f.react}                 /* somebody else got it – search again */
  var hid=crawl&&f.hide>.35;
  if(f.sc<=0&&!hid&&hungry(f,dt)){if(!f.pt&&f.rt<=0){f.pt=nearestPel(f);f.rt=f.react*(f.pt?1:2.5)}}else f.pt=null;
  if(crawl)updCrawl(f,dt,hid);else updSwim(f,dt);
  tryEat(f);
}

function updSwim(f,dt){
  var sp=f.sp,spd=f.sp0*f.mood*water.slug,tx=f.tx,ty=f.ty,go=1,d,dx,dy,k;
  var lead=f.ld&&f.ld.mode==='live'&&!f.pt&&f.sc<=0?f.ld:null;
  if(f.sc>0){f.sc-=dt;spd*=1+(CFG.scare.speedMul-1)*(f.scS||1)*cl(f.sc/.5,0,1)}   /* dart, then ease back to normal */
  else if(f.pt){tx=f.pt.x+(f.pt.in&&!f.pt.rest?f.pt.vx*.4:0);ty=f.pt.y+(f.pt.in&&!f.pt.rest?f.pt.vy*1.2:0);spd=Math.max(spd*sp.chase,CFG.food.minChase)}
  else if(lead){f.ot-=dt;if(f.ot<=0){f.ot=R(2,5);f.ox=R(-100,100);f.oy=R(-50,50)}tx=lead.x+f.ox;ty=lead.y+f.oy}
  dx=tx-f.x;dy=ty-f.y;d=Math.hypot(dx,dy)||1;
  if(lead)spd*=cl(.45+d/110,.45,1.7);
  if(f.kind==='drift'){f.pulse=Math.pow(Math.max(0,Math.sin(f.t*1.9+f.ph)),2);spd*=.2+1.7*f.pulse}
  if(f.hold>0&&!f.pt&&f.sc<=0&&!lead){f.hold-=dt;go=f.kind==='drift'?.15:0}
  else if(d<40&&!f.pt&&!lead&&f.sc<=0){if(Math.random()<sp.pause[0])f.hold=R(sp.pause[1],sp.pause[2]);pick(f)}
  k=Math.min(1,dt*(f.sc>0?5:sp.accel));
  f.vx+=(dx/d*spd*go-f.vx)*k;f.vy+=(dy/d*spd*go-f.vy)*k;
  if(sp.kind==='drift'&&!f.pt&&f.sc<=0)f.vy+=8*dt;                       /* octopus slowly sinks between jets */
  f.x+=f.vx*dt;f.y+=f.vy*dt;
  var b=bnds(f);
  if(f.x<b[0]||f.x>b[1]){f.x=cl(f.x,b[0],b[1]);f.vx*=-.2;if(!f.pt)pick(f)}
  if(f.y<b[2]||f.y>b[3]){f.y=cl(f.y,b[2],b[3]);f.vy*=-.2;if(!f.pt)pick(f)}
  if(Math.abs(f.vx)>6&&!(f.pt&&Math.abs(dx)<30))f.face=f.vx>0?1:-1;
  f.fa+=(f.face-f.fa)*Math.min(1,dt*sp.turn);
  var tilt;
  if(f.kind==='bob'){f.yoff=Math.sin(f.t*1.7+f.ph)*9;tilt=Math.sin(f.t*1.1+f.ph)*.07+f.vx*.0006*f.face}
  else if(f.kind==='drift'){tilt=cl(f.vx*.002,-.12,.12)+Math.sin(f.t*.8+f.ph)*.03;f.sqy=1+(f.pulse||0)*.1-.04;f.sqx=1-(f.pulse||0)*.06}
  else tilt=Math.atan2(f.vy,Math.abs(f.vx)+20)*.5*f.face;
  f.rot+=(tilt-f.rot)*Math.min(1,dt*6);
  if(f.kind==='swim'){f.sqx=1+Math.sin(f.t*5)*.025}
}

function updCrawl(f,dt,hid){
  var sp=f.sp,tx=f.tx,spd=f.sp0*f.mood*water.slug,go=1,still=f.kind==='still';
  if(sp.hide){f.hideT=Math.max(0,f.hideT-dt);f.hide+=((f.hideT>0?1:0)-f.hide)*Math.min(1,dt*(f.hideT>0?10:3))}
  if(f.sc>0){f.sc-=dt;spd*=2.6;tx=f.fleeX}
  else if(f.pt){tx=f.pt.x;spd*=sp.chase}
  else if(f.hold>0){f.hold-=dt;go=0}
  else if(Math.abs(tx-f.x)<12){if(Math.random()<sp.pause[0])f.hold=R(sp.pause[1],sp.pause[2]);pick(f)}
  if(hid)go=0;
  if(f.pt&&Math.abs(f.pt.x-f.x)<8)go=0;
  var dir=Math.sign(tx-f.x),want=dir*spd*go;
  f.vx+=(want-f.vx)*Math.min(1,dt*5);f.x+=f.vx*dt;
  var b=bnds(f);if(f.x<b[0]||f.x>b[1]){f.x=cl(f.x,b[0],b[1]);f.vx=0;pick(f)}
  var mv=Math.abs(f.vx)>(still?1:3);
  if(mv)f.gait+=dt*sp.step;
  if(mv&&f.L.face!==0)f.face=f.vx>0?1:-1;
  f.fa+=(f.face-f.fa)*Math.min(1,dt*7);
  if(f.sp.style==='sidestep'){f.yoff=mv?-Math.abs(Math.sin(f.gait))*4:0;f.rot=mv?Math.sin(f.gait)*.035:f.rot*.8}
  else if(f.sp.style==='waddle'){f.yoff=mv?-Math.abs(Math.sin(f.gait))*2.5:0;f.rot=mv?Math.sin(f.gait)*.05:f.rot*.8}
  else{f.rot=Math.sin(f.t*.5+f.ph)*.04;f.sqx=f.sqy=1+Math.sin(f.t*1.1+f.ph)*.012}
  f.y=groundY(f);
}

function scare(x,y){
  rip.push({x:x,y:y,r:10,a:1,tap:1});decorShake(x,y,CFG.scare.radius);
  fish.forEach(function(f){
    if(f.mode!=='live')return;
    var dx=f.x-x,dy=f.y-y,d=Math.hypot(dx,dy);if(d>=CFG.scare.radius)return;
    if(f.kind==='crawl'||f.kind==='still'){
      if(f.sp.hide){f.hideT=R(f.sp.hide[0],f.sp.hide[1]);f.pt=null}
      else if(f.kind==='crawl'){f.sc=R(.9,1.5);f.pt=null;f.fleeX=cl(f.x+(dx>=0?1:-1)*420,MARG+f.w,TW-MARG-f.w)}
      else f.chew=.4;
      return}
    f.scS=1;f.sc=R(CFG.scare.time[0],CFG.scare.time[1]);f.hold=0;f.pt=null;
    var b=bnds(f);f.tx=cl(f.x+dx/(d||1)*520,b[0],b[1]);f.ty=cl(f.y+dy/(d||1)*300,b[2],b[3]);
  });
}

var J={x:TW*CFG.jar.x,y:CFG.jar.y,vx:0,vy:0,rot:0,rv:0,tx:TW*CFG.jar.x,ty:CFG.jar.y,hold:0,acc:0,stock:CFG.jar.cap,lid:0,pop:0,rat:0,sp:0,st:0,rest:0,pour:0,sgn:1,mode:0,dir:1,t2:0},HX=TW*CFG.jar.x,HY=CFG.jar.y,ptr={},np=0,hid=-1,lastTap=0;
J.jp=[];J.land=0;J.fall=0;J.gone=0;J.wet=0;J.inW=false;J.bt=0;J.racc=0;J.ce=0;
function toW(sx,sy){return[CX+(sx-W/2)/Z,CY+(sy-H/2)/Z]}
function clampC(){var vw=W/Z,vh=H/Z,M=CFG.tank.wall,top=-CFG.camera.aboveTank,bot=TH+M;

/* ---- JAR ----
   Movement : grab it at its home spot, then it follows the finger anywhere on screen. Rules of the world:
              above the rim it is free; the glass walls block sideways entry; inside the tank the sand is a hard floor;
              outside the tank (the gaps left/right of the glass) there is no floor - going below the tank drops it,
              it is missing for CFG.jar.respawn seconds, then reappears at home.
   Pellets  : real little circles simulated in the jar's own (tilting) frame - gravity, jar acceleration, spin, wall + pellet collisions.
              They leave only through the mouth, only while the lid is open, at most CFG.jar.pourRate per second.            */
var JR={rim:-130,hwIn:90,hwOut:85};
function jarZone(x){return x<0?-1:x>TW?1:0}
function jarClamp(x,y){                                     /* physical rules (glass + sand) – used for the finger target AND the jar itself */
  if(y<JR.rim)return [x,y];                                 /* above the rim: nothing in the way */
  var z=jarZone(J.x);                                       /* which side of the glass the jar is on right now */
  if(z<0)return [Math.min(x,-JR.hwOut),y];
  if(z>0)return [Math.max(x,TW+JR.hwOut),y];
  return [cl(x,JR.hwIn,TW-JR.hwIn),Math.min(y,SURF-CFG.jar.floorPad)]}
function jarLim(x,y){var vw=W/Z/2,vh=H/Z/2;                 /* stay on screen, then obey the world */
  return jarClamp(cl(x,CX-vw+40,CX+vw-40),cl(y,CY-vh+70,CY+vh-70))}
function jarKick(){J.jp.forEach(function(p){p.vy-=R(80,240);p.vx+=R(-90,90)})}
function jarAdd(){var P=J.jp,m=100,k;for(k=0;k<P.length;k++)if(P[k].y<m)m=P[k].y;
  P.push({x:R(-55,55),y:cl(m-17,-88,100),vx:0,vy:0,px:0,py:0,ce:0})}
function jarSet(n){var P=J.jp;n=Math.round(cl(n,0,CFG.jar.cap));while(P.length>n)P.pop();while(P.length<n)jarAdd();J.stock=P.length}
function jarFill(){var P=J.jp,r=0,c,n;P.length=0;                /* neat starting pile, then let physics settle it */
  while(P.length<CFG.jar.cap){n=r%2?8:9;for(c=0;c<n&&P.length<CFG.jar.cap;c++)P.push({x:(r%2?-56:-64)+c*16+R(-1,1),y:109-r*14+R(-1,1),vx:0,vy:0,px:0,py:0,ce:0});r++}

function jarWall(p,rc){var hwB=77-rc,hwN=47-rc,yb=117-rc,ys=-96+rc,yt=-123+rc;
  if(p.y<ys&&Math.abs(p.x)>hwN){if(p.y<ys-9)p.x=p.x<0?-hwN:hwN;else p.y=ys}   /* shoulder of the jar */
  if(p.x>hwB)p.x=hwB;else if(p.x<-hwB)p.x=-hwB;

function jarPhys(dt,ax,ay,al){var C=CFG.jar,P=J.jp,n=P.length,a,b,p,q,it,sb,dx,dy,d2,d,m;if(!n)return;
  var rc=C.pelR+1,D=2*rc,D2=D*D,s=Math.sin(J.rot),c=Math.cos(J.rot),w2=J.rv*J.rv*.5,k=.8,h=dt/2;al*=.5;
  var gx=C.grav*s-(ax*c+ay*s)*k,gy=C.grav*c-(-ax*s+ay*c)*k;               /* gravity + jar acceleration, expressed in the jar's frame */
  for(sb=0;sb<2;sb++){
    for(a=0;a<n;a++){p=P[a];p.vx+=(gx+w2*p.x+al*p.y)*h;p.vy+=(gy+w2*p.y-al*p.x)*h;p.px=p.x;p.py=p.y;p.x+=p.vx*h;p.y+=p.vy*h;p.ce=0}

        if(dx>D||dx<-D||dy>D||dy<-D)continue;d2=dx*dx+dy*dy;if(d2>=D2)continue;
        if(d2<1e-4){dx=R(-1,1);dy=R(-1,1);d2=dx*dx+dy*dy}d=Math.sqrt(d2);m=(D-d)/d*.5;p.x-=dx*m;p.y-=dy*m;q.x+=dx*m;q.y+=dy*m}}

    for(a=0;a<n;a++){p=P[a];p.vx=(p.x-p.px)/h*.996;p.vy=(p.y-p.py)/h*.996;var v=Math.hypot(p.vx,p.vy);if(v>900){p.vx*=900/v;p.vy*=900/v}else if(v<6){p.vx=0;p.vy=0}}}}

  if(J.lid>.5&&J.pour>.3&&pel.length<CFG.food.limit&&P.length){J.acc=Math.min(2,J.acc+dt*C.pourRate);
    while(J.acc>=1){bi=-1;by=1e9;for(a=0;a<P.length;a++)if(P[a].ce&&P[a].y<by){by=P[a].y;bi=a}
      if(bi<0){J.acc=Math.min(J.acc,1);break}
      var p=P[bi],s=Math.sin(J.rot),c=Math.cos(J.rot),rx=p.x*c-p.y*s,ry=p.x*s+p.y*c,wx=J.x+rx,wy=J.y+ry,wet=wy>WL;
      var vx=J.vx-J.rv*ry+(p.vx*c-p.vy*s),vy=J.vy+J.rv*rx+(p.vx*s+p.vy*c),sp=Math.hypot(vx,vy);if(sp>420){vx*=420/sp;vy*=420/sp}
      var out=wx<0||wx>TW;pel.push({x:wx,y:wy,vx:vx*(wet&&!out?.5:1),vy:vy*(wet&&!out?.5:1),rest:0,in:wet&&!out?1:0,out:out?1:0});     /* leaves with the jar's own motion */

  }else J.acc=Math.min(J.acc,1)}
function jarDrop(){J.fall=.001;J.land=0;J.hold=0;J.mode=0;if(hid>=0&&ptr[hid]){ptr[hid].lost=1;ptr[hid].m=999}hid=-1;J.vy=Math.max(J.vy,250);J.rv=(J.vx>=0?1:-1)*4;J.pour=0}
function jarRespawn(){var h=jarLim(HX,HY);J.gone=0;J.land=1;J.x=h[0];J.y=Math.min(h[1],CY-H/Z/2)-170;J.vx=J.vy=0;J.rot=0;J.rv=0;J.hold=0;J.mode=0;J.pour=0;J.lid=0;J.wet=0;J.inW=false;J.pop=1;J.rat=1;
  J.jp.forEach(function(p){p.vx=p.vy=0});for(var k=0;k<40;k++)jarPhys(1/60,0,0,0);}
function updJar(dt){var C=CFG.jar,P=J.jp;
  if(J.gone>0){J.gone-=dt;if(J.gone<=0)jarRespawn();return}
  if(J.fall){J.vy+=2600*dt;J.x+=J.vx*dt;J.y+=J.vy*dt;J.rot+=J.rv*dt;J.fall+=dt;
    if(J.y>CY+H/Z/2+250||J.fall>3){J.fall=0;J.gone=R(C.respawn[0],C.respawn[1])}return}
  if(!J.hold&&jarZone(J.x)!==0){jarDrop();return}                          /* let go outside the tank: it falls away */
  if(J.land){var lh=jarLim(HX,HY);J.vy+=2600*dt;J.y+=J.vy*dt;J.x=lh[0];J.vx=0;J.rot=0;J.rv=0;
    if(J.y>=lh[1]){J.y=lh[1];J.vy=-J.vy*.25;J.land=0;J.pop=1;J.rat=1;rip.push({x:J.x,y:J.y+60,r:10,a:.8,tap:1});jarKick()}
    jarPhys(dt,0,0,0);return}
  var wt=(J.x<0||J.x>TW)?0:cl((J.y+110-WL)/150,0,1);J.wet+=(wt-J.wet)*Math.min(1,dt*6);       /* 0 dry .. 1 fully under water */
  var pvx=J.vx,pvy=J.vy,prv=J.rv,k=J.hold?C.spring.held:C.spring.home,c=2*Math.sqrt(k)*(J.hold?.95:.42)*(1+.7*J.wet);
  var hx=J.hold?J.tx:cl(J.x,JR.hwIn,TW-JR.hwIn),hy=J.hold?J.ty:HY;      /* released: rise straight up to the zone above the tank, keep the same x */
  J.vx+=((hx-J.x)*k-J.vx*c)*dt;J.vy+=((hy-J.y)*k-J.vy*c)*dt;J.x+=J.vx*dt;J.y+=J.vy*dt;
  var q=jarClamp(J.x,J.y);if(q[0]!==J.x){J.x=q[0];J.vx=0}if(q[1]<J.y){J.y=q[1];J.vy=Math.min(0,J.vy)*.3}
  if(jarZone(J.x)!==0&&J.y>TH+40){jarDrop();return}                       /* slipped out through the gap beside the tank, below the floor */
  J.sp+=(Math.hypot(J.vx,J.vy)-J.sp)*Math.min(1,dt*10);
  if(Math.abs(J.vx)>40)J.dir=J.vx>0?1:-1;J.sgn=J.dir;
  if(J.mode===1&&J.stock<1)J.mode=0;var want=J.mode===1&&J.stock>=1;
  J.pour+=((want?1:0)-J.pour)*Math.min(1,dt*6);
  var lean=cl(J.vx*.0011,-.5,.5),idle=(J.hold?Math.sin(T*3)*.03:Math.sin(T*1.7)*.05+Math.sin(T*2.9)*.02)*(1-.5*J.wet)+Math.sin(T*1.3)*.03*J.wet;
  var pa=C.pourAngle+(C.pourAngleEmpty-C.pourAngle)*(1-cl(J.stock/C.cap,0,1));     /* tips further as it empties */
  var target=J.pour>.5?pa*J.sgn:lean+idle;
  J.rv+=((target-J.rot)*80-J.rv*9*(1+.5*J.wet))*dt;J.rot+=J.rv*dt;
  J.lid+=((J.pour>.3?1:0)-J.lid)*Math.min(1,dt*9);J.pop=Math.max(0,J.pop-dt*2.2);J.rat=Math.max(0,J.rat-dt*2);
  jarPhys(dt,cl((J.vx-pvx)/dt,-6000,6000),cl((J.vy-pvy)/dt,-6000,6000),cl((J.rv-prv)/dt,-150,150));
  jarExit(dt);
  if(J.pour<.3){J.rest-=dt;if(J.rest<=0&&P.length<C.cap){J.racc+=C.refill*dt;while(J.racc>=1&&P.length<C.cap){J.racc--;jarAdd()}}}
  J.stock=P.length;

  var inW=J.x>0&&J.x<TW&&J.y+125>WL+8,k2;
  if(inW!==J.inW){J.inW=inW;if(J.x>0&&J.x<TW){rip.push({x:J.x,y:WL,r:12,a:.9});rip.push({x:J.x,y:WL,r:4,a:.7});
    for(k2=0;k2<7;k2++)bub.push({x:J.x+R(-70,70),y:WL+R(10,80),s:R(10,22),c:['bubble_a','bubble_b','bubble_c'][k2%3],v:R(80,130),ph:R(0,6)});
    if(inW&&J.hold)jarScare(0,true)}}
  J.bt-=dt;if(J.wet>.35&&J.bt<=0&&bub.length<CFG.bubbles.max+30){J.bt=J.pour>.5?.08:(J.sp>120?.12:.7);
    var bx=J.pour>.5?J.x+125*Math.sin(J.rot):J.x+R(-70,70),by=J.pour>.5?J.y-125*Math.cos(J.rot):J.y+R(-40,60);
    bub.push({x:bx,y:by,s:R(9,20),c:['bubble_a','bubble_b'][Math.floor(R(0,2))],v:R(70,115),ph:R(0,6)})}
  if(J.hold&&J.wet>.05)jarScare(dt)}
function jarScare(dt,burst){if(burst)J.st=.1;else{J.st-=dt;if(J.st>0)return;J.st=.1}      /* strength = proximity (to the jar's edge) x jar speed */
  var Rr=CFG.jar.scareR,sp=burst?1.4:Math.min(1.6,.6+J.sp/350);
  fish.forEach(function(f){if(f.mode!=='live')return;
    var dx=f.x-J.x,dy=f.y-J.y,d=Math.hypot(dx,dy),de=Math.max(0,d-95);if(de>=Rr)return;
    var s=(1-de/Rr)*sp;if(s<CFG.jar.scareMin)return;
    if(f.kind==='crawl'||f.kind==='still'){
      if(f.sp.hide){f.hideT=Math.max(f.hideT,R(f.sp.hide[0],f.sp.hide[1]));f.pt=null}
      else if(f.kind==='crawl'){f.sc=Math.max(f.sc,R(.9,1.5)*(.6+s));f.pt=null;f.fleeX=cl(f.x+(dx>=0?1:-1)*(250+600*s),MARG+f.w,TW-MARG-f.w)}

    f.sc=R(.9,1.4)*(.7+s*1.2);f.scS=Math.min(1.6,.5+s*1.3);f.hold=0;f.pt=null;      /* dart away fast, then ease back (see updSwim) */
    var b=bnds(f);f.tx=cl(f.x+dx/(d||1)*(350+600*s),b[0],b[1]);f.ty=cl(f.y+dy/(d||1)*(200+300*s),b[2],b[3])});

/* ---- WATER QUALITY: leftover pellets on the sand pollute; eating them / time cleans ---- */
function updWater(dt){var W_=CFG.water,n=0,k;
  for(k=0;k<pel.length;k++)if(pel[k].rest>0)n++;
  water.p=cl(water.p+(n*W_.perPellet-W_.selfClear)*dt,0,1);
  water.vis+=(water.p-water.vis)*Math.min(1,dt*.8);
  water.ok=water.p<W_.recoverBelow;
  if(water.p>W_.bad)water.badT+=dt;else water.badT=Math.max(0,water.badT-dt*W_.recoverRate);
  water.slug=1-W_.sluggish*cl(water.badT/W_.sluggishAfter,0,1);
  water.hit-=dt;
  if(water.badT>W_.collapseAfter&&water.hit<=0){water.hit=W_.collapseEvery;
    var live=fish.filter(function(q){return q.mode==='live'});
    var pool=live.filter(function(q){return !q.perm});if(pool.length){var f=pool[Math.floor(Math.random()*pool.length)];
      if(f.sp.recover==='skeleton'&&f.L.skel){f.perm=true;f.skel=true;f.pop=1;burst(f.x,f.y,8);rip.push({x:f.x,y:f.y,r:10,a:.8,tap:1})}   /* turns into a permanent, still-swimming skeleton */
      else{startDown(f);f.cause='water'}}}   /* different cause than overeating */

  else if(d.cs==='open'){d.ct-=dt;if(d.ct<=0)d.cs='closing'}

    if(p.rest){p.rest-=dt;if(p.rest<=0)pel.splice(i,1);continue}

}

  ctx.drawImage(ATLAS,m[0],m[1]+sT,m[2],m[3]-sT,-w/2,0,w,bh);ctx.restore();

  /* o = {fid,name, sp:'blue' [,look]}  (existing species)   or   {fid,name, img:dataURL, face:1|-1}  (drawn / photo fish, face = side the picture looks at).
     Does nothing and returns false when a fish with that fid already exists, so the game can call it again safely. cb(fish) runs once it is in the tank. */
  addFish:function(o,cb){if(!o||!o.fid||fish.some(function(q){return q.fid===o.fid}))return false;
    if(o.img){var im=new Image();im.onload=function(){if(fish.some(function(q){return q.fid===o.fid}))return;
        var iw=im.naturalWidth||1,ih=im.naturalHeight||1,ar=ih/iw,fc=o.face===-1?-1:1,
            L={img:im,ar:ar,face:fc,eyes:[[fc>0?.75:.25,.4]],er:.07},w=cl(125/ar,70,170),
            f=spawn(SPECIES.filter(function(q){return q.custom})[0],null,{L:L,look:'custom',w:w,fid:o.fid,name:o.name});cb&&cb(f)};
      im.onerror=function(){cb&&cb(null)};im.src=o.img;return true}
    var sp=SPECIES.filter(function(q){return q.id===o.sp&&!q.custom})[0];if(!sp)return false;
    var f2=spawn(sp,null,{fid:o.fid,name:o.name,look:LOOKS[o.look]&&sp.looks.indexOf(o.look)>=0?o.look:null});cb&&cb(f2);return true},
  removeFish:function(fid){var f=fish.filter(function(q){return q.fid===fid})[0];return f?window.Aquarium.removeCreature(f):false},
  renameFish:function(fid,name){var f=fish.filter(function(q){return q.fid===fid})[0];if(!f)return false;f.name=String(name).slice(0,20);return true},
  /* small picture of a fish for the book (data URL, fish drawn at its native facing) */
  thumb:function(fid,px){var f=fish.filter(function(q){return q.fid===fid})[0];return f?thumbOf(f.L,px):''},
  speciesThumb:function(id,px){var sp=SPECIES.filter(function(q){return q.id===id&&!q.custom})[0];return sp?thumbOf(LOOKS[sp.looks[0]],px):''},
  isFull:function(){return !MINI&&!TR},
  removeCreature:function(x){var f=find(fish,x,'sp'),k=fish.indexOf(f);if(k<0)return false;fish.forEach(function(g){if(g.ld===f)g.ld=null});fish.splice(k,1);return true},
  addDecor:function(id){var D=DECOR.filter(function(q){return q.id===id})[0];if(!D)return null;var n=decor.length;buildDecor([D],true);return decor[n]||null},
  removeDecor:function(x){var d=find(decor,x,'D'),k=decor.indexOf(d);if(k<0)return false;decor.splice(k,1);return true},
  dropFood:function(x,n){for(var k=0;k<(n||1);k++)pel.push({x:x+R(-30,30),y:-20,vx:R(-20,20),vy:R(0,80),rest:0,in:0})},
  refillJar:function(){jarSet(CFG.jar.cap)},openChest:function(){decor.forEach(function(d){if(d.D.chest&&(!d.cs||d.cs==='closed')){d.cs='opening';d.cu=0;chestBubbles(d)}})},
  getState:function(){return {running:running,pollution:+water.p.toFixed(3),waterOk:water.ok,badSeconds:+water.badT.toFixed(1),jar:Math.floor(J.stock),
    creatures:fish.map(function(f){return {id:f.sp.id,fid:f.fid,name:f.name,look:f.look,x:Math.round(f.x),y:Math.round(f.y),mode:f.mode,cause:f.cause||null,full:+(f.stom/f.cap).toFixed(2)}}),
    decor:decor.map(function(d){return {id:d.D.id,sprite:d.s,x:Math.round(d.x),state:d.cs||null}})}},
  setState:function(st){if(st.pollution!=null)water.p=water.vis=cl(st.pollution,0,1);if(st.jar!=null)jarSet(st.jar);
    if(st.creatures)Object.keys(st.creatures).forEach(function(id){var have=fish.filter(function(f){return f.sp.id===id}),want=st.creatures[id],k;
      for(k=have.length;k<want;k++)window.Aquarium.addCreature(id);for(k=have.length;k>want;k--)window.Aquarium.removeCreature(have[k-1])})},
  worldToScreen:function(x,y){return [W/2+(x-CX)*Z,H/2+(y-CY)*Z]},
  wake:wake,scare:scare,knockOut:startDown,debug:{panel:function(on){if(on&&!document.getElementById('aq-dbg'))buildDebug()},state:DBG}};
})();
</script><button id="closeTank" aria-label="Close aquarium" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:99999;width:42px;height:42px;border-radius:50%;border:3px solid #E8A458;background:#FFE9B5;color:#6B3F1D;font:700 20px/1 sans-serif;cursor:pointer;touch-action:manipulation">✕</button>
<script>
/* 🐟 add-fish button: only while the tank is open full screen. The drawing / photo / name dialogs belong to the main page, so this just asks it to open them. */
(function(){
  if(window.parent===window)return;
  var css=document.createElement('style');
  css.textContent='#fishBtn{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 64px);z-index:99999;width:42px;height:42px;border-radius:50%;border:3px solid #E8A458;background:#FFE9B5;font:700 20px/1 sans-serif;cursor:pointer;touch-action:manipulation}'+
   '#fishDd{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:99999;min-width:188px;background:#FFF3D9;border:3px solid #E8A458;border-radius:14px;padding:6px;flex-direction:column;gap:2px;font:800 15px Nunito,"Trebuchet MS",system-ui,sans-serif;color:#6B3F1D;box-shadow:0 6px 18px rgba(90,45,10,.3)}'+
   '#fishDd.on{display:flex}#fishDd button{font:inherit;color:inherit;background:transparent;border:0;border-radius:9px;padding:9px 10px;text-align:left;cursor:pointer}#fishDd button:active{background:#FFE0A3}';
  document.head.appendChild(css);
  var b=document.createElement('button'),d=document.createElement('div'),fi=document.createElement('input');
  b.id='fishBtn';b.setAttribute('aria-label','Add a fish');b.textContent='🐟';
  d.id='fishDd';d.innerHTML='<button data-a="draw">✏️ Draw it</button><button data-a="photo">📷 From a photo</button><button data-a="species">🐠 Existing fish</button><button data-a="bye">👋 Say goodbye</button>';
  fi.type='file';fi.accept='image/*';fi.style.display='none';
  document.body.appendChild(b);document.body.appendChild(d);document.body.appendChild(fi);
  function send(m){try{parent.postMessage(m,location.origin)}catch(e){}}
  b.addEventListener('click',function(){d.classList.toggle('on')});
  document.addEventListener('pointerdown',function(e){if(d.classList.contains('on')&&!d.contains(e.target)&&e.target!==b)d.classList.remove('on')});
  d.addEventListener('click',function(e){var x=e.target.closest('button');if(!x)return;d.classList.remove('on');
    if(x.dataset.a==='photo')fi.click();      /* opened here, straight from the tap, so phones allow it */
    else send({t:'fishAdd',how:x.dataset.a})});
  fi.addEventListener('change',function(){var f=fi.files[0];fi.value='';if(f)send({t:'fishPhoto',file:f})});
  /* the button only shows once the main page has said it understands these buttons (an older main page would ignore every tap) */
  var want=false,ok=false;function sync(){var v=want&&ok;b.style.display=v?'block':'none';if(!v)d.classList.remove('on')}
  window.addEventListener('message',function(e){if(e.source===parent&&e.data&&e.data.t==='fishUI'){ok=true;sync()}});
  window.AqFishUI={show:function(on){want=on;sync()}};
  send({t:'fishHello'});
})();
</script>
<script>
(function(){
  if(window.parent===window)return; // opened on its own: no close button
  var b=document.getElementById('closeTank');b.style.display='block';
  var held=false; // true while the aquarium is closed (hidden under the room)
  function aqPause(){try{window.Aquarium.stop();var c=window.Aquarium.aud&&window.Aquarium.aud.ctx;if(c&&c.state==='running')c.suspend()}catch(e){}}
  function aqResume(){try{window.Aquarium.start();window.Aquarium.resize();var c=window.Aquarium.aud&&window.Aquarium.aud.ctx;if(c&&c.state==='suspended')c.resume()}catch(e){}}
  b.addEventListener('click',function(){try{if(window.Aquarium.closeFull())return}catch(x){}held=true;aqPause();parent.postMessage('closeTank',location.origin)});
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin||e.source!==parent)return;
    if(e.data==='tankPause'){held=true;aqPause()}
    if(e.data==='tankResume'){held=false;aqResume()}
    if(e.data==='tankMini'){held=false;try{window.Aquarium.mini()}catch(x){}}
    if(e.data&&e.data.t==='tankFull'){held=false;try{window.Aquarium.openFull()}catch(x){}}
  });
  // also silence it when the whole app goes to the background
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)aqPause(); else if(!held)aqResume();
  });
  document.documentElement.style.overscrollBehavior='none';
})();
</script>
